<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boostera · Sipariş yönetimi</title>
  <style>
    :root{color-scheme:dark;--bg:#10151e;--card:#192231;--line:#2e3c51;--text:#e8eef8;--muted:#a7b7ce;--accent:#78dcc1}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,sans-serif}
    main{max-width:1250px;margin:auto;padding:28px}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
    nav{display:flex;align-items:center;gap:24px;padding:20px 0;border-bottom:1px solid var(--line);margin-bottom:30px;flex-wrap:wrap}
    nav strong{font-size:24px;letter-spacing:-1px;margin-right:auto}h1{font-size:28px;line-height:1.3}h2{font-size:19px}
    .muted,small{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;margin:18px 0}
    .toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.toolbar h1{margin-right:auto}
    button,.button{border:1px solid var(--line);border-radius:7px;padding:10px 16px;background:#28394e;color:var(--text);font:inherit;cursor:pointer;display:inline-block}
    button.primary{background:var(--accent);color:#09251f;font-weight:650}button.danger{background:#673a3f}
    input,select,textarea{width:100%;padding:10px 12px;background:#101925;color:var(--text);border:1px solid #40526b;border-radius:7px;font:inherit}
    textarea{min-height:120px}label{display:block;margin:12px 0 5px;color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
    .table-wrap{overflow:auto}.table-wrap table{min-width:680px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:14px 10px;border-bottom:1px solid var(--line);vertical-align:top}
    th{color:var(--muted);font-size:13px}td{overflow-wrap:anywhere}.badge{display:inline-block;padding:3px 9px;border-radius:6px;background:#2b4056;font-size:13px;white-space:nowrap}
    .ready,.submitted,.finished{background:#214b42;color:#b1f5df}.uncertain,.error,.review{background:#603b31;color:#ffcfbb}
    .waiting,.paused{background:#51472c;color:#f5dfa1}.notice{border-left:4px solid var(--accent);padding:14px 18px;background:#1b3433;margin:16px 0}
    .error-text{color:#ffcfbb}code{color:#cae2f9;overflow-wrap:anywhere}details{margin:14px 0}summary{cursor:pointer;color:var(--accent)}
    .inline{display:inline-block;margin:4px 5px 4px 0}.empty{padding:35px;text-align:center;color:var(--muted)}.break{overflow-wrap:anywhere}
    .grid p{margin:5px 0}.component-row{border:1px solid var(--line);border-radius:8px;padding:15px;margin:15px 0}button:disabled{opacity:.4;cursor:default}
    @media(max-width:650px){main{padding:16px}.card{padding:16px}h1{font-size:23px}nav{gap:15px}th,td{padding:10px 7px}}
  </style>
</head>
<body><main>
  <nav><strong>Boostera</strong><a href="/admin">Siparişler</a><a href="/admin/services">İlan eşleştirmeleri</a><a href="/admin/export">CSV indir</a><a href="/admin/migration">Veri aktarımı</a></nav>
  {% if message %}<div class="notice">{{ message }}</div>{% endif %}
  {% block content %}{% endblock %}
  <p class="muted"><small>Bekletilen siparişler kendiliğinden gönderilmez. Gönderim için senin işlemin gerekir.</small></p>
</main></body>
</html>
